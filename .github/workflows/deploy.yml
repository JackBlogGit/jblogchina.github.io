name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 验证提交签名链（fafa415 起的每个提交必须由签名密钥验证通过）
        run: |
          echo "JackBlogGit@users.noreply.github.com namespaces=\"git\" $(cat .github/deploy-signing.pub)" > allowed_signers
          git config gpg.ssh.allowedSignersFile "$PWD/allowed_signers"
          git config gpg.format ssh
          fail=0
          for c in $(git rev-list fafa415..HEAD); do
            if ! git verify-commit "$c" 2>/dev/null; then
              echo "::error::commit $c 未签名或签名无效"
              fail=1
            fi
          done
          git verify-commit HEAD || { echo "::error::HEAD 签名无效"; exit 1; }
          [ "$fail" = "0" ] && echo "提交签名链验证通过" || exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 计算 Pages 子路径 base
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$repo" = "$owner.github.io" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$repo/" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      # 只用 vite build：项目基线存在已知 tsc 类型错误（见 README/记忆），CI 不跑 tsc -b
      - run: npx vite build
        env:
          PAGES_BASE: ${{ steps.base.outputs.value }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
