# Jblog 防盗链 / 防爬虫 —— nginx 服务端策略
#
# 前端 JS 只是威慢：Referer 与 UA 都能伪造。真正拦截必须放在服务端。
# 用法：复制到 nginx 配置目录，在站点 server { } 内
#       include deploy/nginx-security.conf;
# 然后 nginx -t && nginx -s reload
#
# 上线前必须改：把下面两处 jblog.example.com 换成你的真实域名。

# ---------- 1. 限速区域（放在 http{} 层：若 include 在 server{} 内，请把这两行移到 http{}）----------
# rate 是「稳态」请求速率，burst 允许突发；按真实访问量调
limit_req_zone $binary_remote_addr zone=jblog_ip:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=jblog_media:10m rate=25r/s;
limit_req_status 403;   # 超限直接 403，不给爬虫重试空间

# ---------- 2. UA 黑名单：爬虫 / 采集器 / 无 UA / 盗链请求 ----------
# $jblog_deny = 1 表示该请求应被拒绝
map $http_user_agent $jblog_ua_deny {
    default   0;
    ""        1;   # 空 UA：正常浏览器不会出现
    "~*(python-requests|python-urllib|scrapy|go-http-client|java/|okhttp|libwww|curl/|wget|node-fetch|axios|httpclient|phantomjs|headlesschrome|selenium|puppeteer)" 1;
    "~*(gptbot|chatgpt-user|claudebot|ccbot|perplexitybot|google-extended|bytespider|amazonbot|diffbot|facebookbot|youbot|qwantify|mj12bot|dotbot|petalbot|semrush|ahrefs|baiduspider|sogou\s?web\s?spider|360spider|yisouspider)" 1;
}

# 有 Referer 且不是本站/本地 → 判定盗链（无 Referer 不在这里拦，见第 5 节说明）
map $http_referer $jblog_hotlink_deny {
    default   0;
    "~^https?://([a-zA-Z0-9.-]*\.)?jblog\.example\.com(:[0-9]+)?(/|$)" 0;   # ← 换成主域名
    "~^https?://([a-zA-Z0-9.-]*\.)?(localhost|127\.0\.0\.1)(:[0-9]+)?(/|$)" 0;
    "~^https?://"  1;   # 其它任何带 Referer 的外部站点
}

map "$jblog_ua_deny$jblog_hotlink_deny" $jblog_deny {
    default  1;
    "00"     0;
}

# ---------- 3. 全站响应头：防盗链 + 防点击劫持 + 禁收录 ----------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow, noimageindex" always;
# CSP 会影响 three.js 的 blob/worker 与外链图片，先自测再启用
# add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

# ---------- 4. 页面与接口：限速 + 拒绝机器人 ----------
location / {
    limit_req zone=jblog_ip burst=20;
    if ($jblog_deny) {
        return 403;
    }
    try_files $uri $uri/ /index.html;
}

# ---------- 5. 图片 / 3D 模型 / 音视频：更强的防盗链 ----------
# 说明：不拦「无 Referer」的直链访问（否则用户自己收藏、App 内打开也会被误伤）；
# 如需连直链一起禁，在 $jblog_hotlink_deny 的 map 里加一条 `""  1;`。
# nginx 不允许同一 location 里串联多个 if，因此统一走 $jblog_deny（它已包含 Referer 判定）。
location ~* ^/(images|models|videos|music)/ {
    # 等价的官方写法，供对照：valid_referers none blocked server_names *.jblog.example.com jblog.example.com localhost 127.0.0.1;
    if ($jblog_deny) {
        return 403;
    }
    limit_req zone=jblog_media burst=60;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
}

# ---------- 6. 隐藏文件与后台路径枚举 ----------
location ~ /\. {
    return 403;   # .git / .env / .ssh 等
}
